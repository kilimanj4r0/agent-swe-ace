# ==========================================================================
# ACE-SWE Configuration
# ==========================================================================
#
# Config layers (later overrides earlier):
#   config.yaml  <  --config <file>  <  CLI args
#
# Override configs in configs/ are deep-merged on top of this file.
# API keys live in .env (ZAI_API_KEY, HOSTED_VLLM_API_KEY), not here.
#
# Skillbook modes:
#   per_instance — fresh skillbook per instance, learn from own failures
#   per_repo     — shared skillbook per repo, two-phase train/val experiment
#   global       — single skillbook across all instances
#
# Two-phase experiment (per_repo/global + split):
#   Train phase:    1 attempt, force learn (even on success), skillbook accumulates
#   Val baseline:   1 attempt, empty skillbook, frozen (no learning)
#   Val skillbook:  1 attempt, learned skillbook from train, frozen (no learning)
#   Requires: experiment.split + benchmark.filter_repos (or equivalent)
#
# ==========================================================================

experiment:
  name: "mini-swe-v1-skillbook-learning"
  description: "ACE skillbook learning experiment on SWE-bench Lite"
  max_attempts: 10                     # Max retry attempts per instance (train phase overrides to 1)
  force_learn: true                    # true = learn runs on unresolved even with max_attempts=1 (default)
                                       # false = skip learn when max_attempts=1 (saves API costs in per_instance mode)
  concurrency: 1                       # Within-repo val parallelism (1 = sequential). Train is always sequential in two-phase.
  # iterate_repos_concurrency: 1       # Between-repo parallelism in iterate_repos (peak prediction parallelism ~ M x N)
  random_seed: 42                      # For reproducibility (used in train/val split)

  skillbook:
    mode: "per_instance"               # "per_instance", "per_repo", or "global"
    custom_swe_learn: true             # true = SWEReflector+SWESkillManager (anti-patterns, type prefixes)
                                       # false = default ACE Reflector+SkillManager (PydanticAI-based)
    deduplication:
      enabled: true                    # Deduplicate similar skills via cosine similarity
      similarity_threshold: 0.85       # Threshold (0-1); higher = stricter matching
      embedding_provider: "sentence_transformers"  # or "litellm"
      local_model_name: "all-MiniLM-L6-v2"         # Local embedding model
      embedding_device: "cpu"                        # Device for embedding model ("cpu" or "cuda")
      within_section_only: true        # Only compare skills within same skillbook section
      min_pairs_to_report: 1           # Min duplicate pairs to trigger consolidation

    retrieval:
      enabled: false                   # Enable top-k skill retrieval before predict
      type: "llm"                      # Retriever type: "llm" (default), "random", "embedding", "bm25"
      top_k: 5                         # Number of skills to retrieve
      skip_threshold: 10               # Skip retrieval if skillbook has ≤ N skills
      # --- LLM-specific (type: "llm") ---
      model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"  # LLM for filter + rank stages
      api_base: "http://localhost:8800/v1"          # API base URL
      api_key_env: "HOSTED_VLLM_API_KEY"            # Environment variable for API key
      temperature: 0.0
      max_tokens: 2048
      chunk_size: 200                  # Skills per filter chunk (for large skillbooks)
      filter_target: 100               # Max skills to keep after filtering stage
      # filter_prompt: null            # Path to custom filter prompt file (null = built-in default)
      # rank_prompt: null              # Path to custom rank prompt file (null = built-in default)
      # --- Embedding-specific (type: "embedding") ---
      # model: "Qwen/Qwen3-Embedding-4B"  # Sentence-transformers model
      # device: "cuda"                     # Device: "cuda" or "cpu"
      # include_section: false             # Prepend skill section to embedding text
      # batch_size: 32                     # Batch size for skill embedding
      # cache_dir: null                    # Embedding cache dir (null = data/.retrieval_cache/)
      # --- Random-specific (type: "random") ---
      # seed: null                         # Random seed for reproducibility (null = non-deterministic)
      # --- BM25-specific (type: "bm25") ---
      # k1: 1.5                            # BM25 term-frequency saturation (typical 1.2-2.0)
      # b: 0.75                            # BM25 length-normalization (0..1, typical 0.75)
      # include_section: false             # Prepend skill section to indexed/query text

  # resume_dirs:                       # Resume from previous runs (copies completed, continues partial)
  #   - data/run_20260415_020540

  # --- Two-phase experiment settings (per_repo/global modes) ---
  # split:                             # Enable train/val split
  #   val_ratio: 0.2                  # Fraction of instances for validation
  # baseline_run_dir: "data/run_20260415_020540"  # Reuse baseline results (skip re-running val baseline + train predict/eval)
  # val_pass_k: 4                     # Number of attempts per val instance (default: 1)
  # eval_on_train: false              # Sanity-check mode: apply the learned skillbook back onto the TRAIN split
  #                                   # instead of running val passes. TrainBL = empty book (1 attempt, pass@1
  #                                   # reference); TrainSB = learned book at eval_on_train_pass_k attempts.
  #                                   # Composes with baseline_run_dir (reuses baseline train predict+eval for TrainBL)
  #                                   # and skillbook_source_dir (skip train/learn, load book for TrainSB).
  # eval_on_train_pass_k: 5           # Attempts per TrainSB instance (default: 1). TrainBL always runs 1 attempt.
  # skillbook_source_dir: "data/run_xxx"  # Load per-repo skillbooks from this run (skips training, validation-only mode)
  # skip_learn: false               # When true: never run Learn phase, always use empty skillbook

# --- Environment ---
# Docker is required for SWE-bench evaluation (swebench images).
environment:
  type: "docker"                      # "docker" (default) or "local"
  namespace: "ghcr.io/epoch-research/"  # Docker registry namespace (set to null for local images)

# --- Agent (mini-swe-agent) ---
agent:
  step_limit: 100                    # Max agent steps per attempt
  cost_limit: 0.0                    # Effectively disabled for local vLLM (no real cost)
  context:
    enabled: false                   # Enable proactive context window management
    context_window: 65536            # Model's total context window in tokens
    keep_recent_messages: 6          # Recent messages kept intact during truncation
    truncate_threshold: 0.85         # Start truncating at 85% of max input tokens

# --- LLM ---
# Two separate LLM configs: agent (runs mini-swe-agent) and ace (runs Reflector/SkillManager).
# API keys are loaded from .env (not stored here).
# Providers: "zai" (Z.AI/GLM), "hosted_vllm" (local vLLM server), or any LiteLLM provider.
llm:
  agent:
    provider: "hosted_vllm"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    # model: "Qwen/Qwen3-Coder-Next-FP8"
    # api_base: "http://localhost:8800/v1"
    # api_base: "http://10.100.30.241:8800/v1"
    api_key_env: "HOSTED_VLLM_API_KEY"
    temperature: 0.0
    max_tokens: 4096

  ace:
    provider: "zai"
    model: "glm-4.5-flash"
    # model: "glm-4.7-flash"
    # api_base: "https://api.z.ai/api/coding/paas/v4"
    # api_base: "https://open.bigmodel.cn/api/coding/paas/v4"
    api_key_env: "ZAI_API_KEY"
    temperature: 0.0
    max_tokens: 4096

# --- Benchmark ---
# benchmark.split is the HuggingFace dataset split (not experiment.split for train/val).
benchmark:
  dataset: "princeton-nlp/SWE-bench_Lite"
  # dataset: "princeton-nlp/SWE-bench_Verified"
  # dataset: "SWE-bench/SWE-bench_Multilingual"
  split: "test"                        # HuggingFace dataset split (not to be confused with experiment.split)
  
  max_instances: null                  # null = all instances, or set number

  # --- Two-phase experiment settings (per_repo/global modes) ---
  # filter_repos: null                 # null = all repos, or list: ["django/django"]
  # iterate_repos:                     # Run independent per-repo two-phase experiments
  #   - "django/django"                # Each repo gets its own train/val split and skillbook
  #   - "sympy/sympy"                  # If experiment.iterate_repos_concurrency > 1, repos run in parallel

  # --- General instances exclusion from any experiment ---
  exclude_instances:                   # Instances that fail to build Docker images
    # Lite + Verified (exist in both datasets)
    - sympy__sympy-20590                # upstream branch 1.7 renamed to sympy-1.7
    - scikit-learn__scikit-learn-25747  # --no-use-pep517 removed in pip 25.1
    # Lite only
    - pylint-dev__pylint-7114           # build_editable hook missing
    - pylint-dev__pylint-7228           # build_editable hook missing
    - pylint-dev__pylint-7993           # build_editable hook missing
    - scikit-learn__scikit-learn-25500  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-25570  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-25638  # --no-use-pep517 removed in pip 25.1
    # Verified only
    - astropy__astropy-8707             # pkg_resources missing in build isolation
    - astropy__astropy-8872             # pkg_resources missing in build isolation
    - pylint-dev__pylint-7277           # build_editable hook missing
    - scikit-learn__scikit-learn-25102  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-25232  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-25931  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-25973  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-26194  # --no-use-pep517 removed in pip 25.1
    - scikit-learn__scikit-learn-26323  # --no-use-pep517 removed in pip 25.1
    - matplotlib__matplotlib-13989      # jQuery UI download hangs during setup.py develop
    - matplotlib__matplotlib-14623      # jQuery UI download hangs during setup.py develop

# --- Evaluation ---
evaluation:
  use_docker: true                    # Use Docker for evaluation (default)
  timeout: 1800                       # Seconds per patch evaluation (30 min)
  rm_image: false                     # Keep Docker image after evaluation (instance-level caching — avoids rebuilds)

# --- Output ---
output:
  dir: "data"
  save_trajectories: true
  save_skillbooks: true
  save_logs: true
  log_level: "INFO"                   # DEBUG, INFO, WARNING, ERROR

# --- LiteLLM ---
litellm:
  suppress_debug_info: true           # Suppress LiteLLM debug output
  log_level: "WARNING"                # Suppress INFO/DEBUG logs from litellm (completion/Wrapper spam)

# --- Observability (optional, Opik tracing via ACE framework) ---
observability:
  enabled: false
  project_name: "agent-swe-ace"
