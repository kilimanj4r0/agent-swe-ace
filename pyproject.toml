[project]
name = "agent-swe-ace"
version = "0.3.0"
description = "ACE skillbook learning with mini-swe-agent for SWE-bench evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Vladimir Makharev" }
]
keywords = ["swe-bench", "ace", "skillbook-learning", "llm", "agent"]

dependencies = [
    "mini-swe-agent",
    "ace-framework[all]==0.9.1",
    "swebench",
    "datasets",
    "pyyaml",
    "python-dotenv",
    "litellm",
    "loguru",
    "torch>=2.10,<2.11",
    "vllm>=0.18.0,<0.21",
    "bm25s>=0.3.9",
]

[tool.uv.sources]
mini-swe-agent = { git = "https://github.com/SWE-agent/mini-swe-agent.git", branch = "v1" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
run-experiment = "scripts.run_experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "integration: tests that make real API calls",
    "slow: tests that take a long time to run",
]
