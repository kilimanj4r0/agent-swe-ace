experiment:
  name: "agent-qwen3-ace-glm"
  description: "ACE skillbook learning experiment on SWE-bench Lite"
  max_attempts: 2                    # Max retry attempts per instance

  skillbook:
    mode: "per_instance"              # "per_instance", "per_repo", or "global"
    custom_swe_learn: true            # SWE-optimized Reflector+SkillManager (anti-patterns, type prefixes)
    deduplication:
      enabled: true
      similarity_threshold: 0.85      # Cosine similarity threshold

agent:
  step_limit: 100                    # Max agent steps per attempt
  cost_limit: 0.0                    # Effectively disabled for local vLLM (no real cost)

llm:
  agent:
    provider: "hosted_vllm"
    model: "Qwen/Qwen3-Coder-Next-FP8"
    api_base: "http://localhost:8800/v1"
    api_key_env: "HOSTED_VLLM_API_KEY"
    temperature: 0.7
    max_tokens: 4096
  ace:
    provider: "zai"
    model: "glm-5"
    api_key_env: "ZAI_API_KEY"
    temperature: 0.7
    max_tokens: 4096

benchmark:
  dataset: "princeton-nlp/SWE-bench_Lite"
  split: "test"
  max_instances: 100                 # null = all instances, or set number

output:
  dir: "data"
  save_trajectories: true
  save_skillbooks: true
  save_logs: true
  log_level: "INFO"                   # DEBUG, INFO, WARNING, ERROR

observability:
  enabled: true
