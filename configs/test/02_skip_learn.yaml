# Smoke test: Skip-learn raw multi-attempt benchmark
# Exercises: predict -> evaluate only, no learning, break on resolve
# Verify: trajectory/result files exist, NO skillbook directories
experiment:
  name: "test: skip-learn"
  max_attempts: 2
  skip_learn: true
  concurrency: 1
  skillbook:
    mode: "per_instance"
    deduplication:
      enabled: false

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent: qwen3-coder-30b-local-8800

  ace: qwen3-coder-30b-local-8800

output:
  dir: "_data"
  log_level: "DEBUG"
