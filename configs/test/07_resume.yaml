# Smoke test: Resume from previous run
# Exercises: scan_resume_dirs, copy_instance_artifacts, skip completed instances
# Runner injects resume_dirs via temp config override
# Verify: statistics.json has resumed_complete_count > 0
experiment:
  name: "test: resume"
  max_attempts: 2
  force_learn: true
  concurrency: 1
  skillbook:
    mode: "per_instance"
    custom_swe_learn: false
    deduplication:
      enabled: false
  # resume_dirs: injected by runner

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"
  ace:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"

output:
  dir: "_data"
  log_level: "DEBUG"
