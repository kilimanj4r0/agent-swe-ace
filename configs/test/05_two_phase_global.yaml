# Smoke test: Two-phase global skillbook
# Exercises: global skillbook accumulation across train instances, single final_skillbook.json
# Verify: skillbooks/final_skillbook.json exists (not per-repo), train/val subdirs
experiment:
  name: "test: two-phase global"
  max_attempts: 1
  force_learn: true
  concurrency: 2
  skillbook:
    mode: "global"
    custom_swe_learn: false
    deduplication:
      enabled: false
  split:
    val_ratio: 0.25
    manifest: "configs/splits/princeton-nlp__SWE-bench_Verified/val_ratio_0_25.json"

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"
  max_instances: 26
  filter_repos: ["django/django"]

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent: qwen3-coder-30b-local-8800

  ace: qwen3-coder-30b-local-8800

output:
  dir: "_data"
  log_level: "DEBUG"
