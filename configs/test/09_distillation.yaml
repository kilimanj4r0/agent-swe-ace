# Smoke test: Teacher distillation
# Exercises: _run_train_instance_from_teacher, load_teacher_trajectory, learn-only train phase
# Verify: statistics.json train_phase has teacher_trajs_found > 0
experiment:
  name: "test: distillation"
  max_attempts: 1
  force_learn: true
  concurrency: 1
  skillbook:
    mode: "per_repo"
    custom_swe_learn: false
    deduplication:
      enabled: false
  split:
    val_ratio: 0.25
    manifest: "configs/splits/princeton-nlp__SWE-bench_Verified/val_ratio_0_25.json"
  train_trajs_dir: "data/teacher_trajs/v1.16_opus45_verified"

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"
  max_instances: 26
  filter_repos: ["django/django"]

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent: qwen3-coder-30b-local-8800

  ace: qwen3-coder-30b-local-8800

output:
  dir: "_data"
  log_level: "DEBUG"
