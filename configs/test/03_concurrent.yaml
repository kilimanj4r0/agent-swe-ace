# Smoke test: Concurrent parallel execution
# Exercises: ThreadPoolExecutor path, per-worker agents, parallel predict
# Verify: 2 instances with output, statistics.json has total: 2
experiment:
  name: "test: concurrent"
  max_attempts: 1
  concurrency: 2
  skillbook:
    mode: "per_instance"
    deduplication:
      enabled: false

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"
  max_instances: 24
  filter_repos: ["django/django"]

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent: qwen3-coder-30b-local-8800

  ace: qwen3-coder-30b-local-8800

output:
  dir: "_data"
  log_level: "DEBUG"
