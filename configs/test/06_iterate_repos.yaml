# Smoke test: iterate_repos with concurrency
# Exercises: per-repo orchestration, concurrent repo processing, per-repo skillbooks/stats
# Note: first 20 Lite instances = 14 django + 6 astropy (both get train+val from manifest)
# Verify: per_repo skillbooks, per_repo stats, combined statistics.json
experiment:
  name: "test: iterate_repos concurrent"
  max_attempts: 1
  force_learn: true
  concurrency: 2
  skillbook:
    mode: "per_repo"
    custom_swe_learn: false
    deduplication:
      enabled: false
  split:
    val_ratio: 0.25
    manifest: "configs/splits/princeton-nlp__SWE-bench_Lite/val_ratio_0_25.json"

benchmark:
  dataset: "princeton-nlp/SWE-bench_Lite"
  split: "test"
  max_instances: 8
  iterate_repos:
    - "django/django"
    - "astropy/astropy"

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"
  ace:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"

output:
  dir: "_data"
  log_level: "DEBUG"
