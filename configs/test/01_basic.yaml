# Smoke test: Basic multi-attempt with learning (per_instance)
# Exercises: predict -> evaluate -> learn loop, skillbook accumulation
# Verify: trajectory/result/skillbook files for iter_0 and iter_1, statistics.json
experiment:
  name: "test: basic multi-attempt"
  max_attempts: 2
  force_learn: true
  concurrency: 1
  skillbook:
    mode: "per_instance"
    custom_swe_learn: false
    deduplication:
      enabled: false

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"
  ace:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"

output:
  dir: "_data"
  log_level: "DEBUG"
