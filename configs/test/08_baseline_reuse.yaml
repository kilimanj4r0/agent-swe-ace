# Smoke test: Baseline reuse in two-phase
# Exercises: _run_train_instance_reusing_baseline, _load_baseline_results_multi
# Runner injects baseline_run_dir via temp config override
# Verify: statistics.json has reused_from_baseline > 0
experiment:
  name: "test: baseline reuse"
  max_attempts: 1
  force_learn: true
  concurrency: 1
  skillbook:
    mode: "per_repo"
    custom_swe_learn: false
    deduplication:
      enabled: false
  split:
    val_ratio: 0.25
    manifest: "configs/splits/princeton-nlp__SWE-bench_Verified/val_ratio_0_25.json"
  # baseline_run_dir: injected by runner

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"
  max_instances: 26
  filter_repos: ["django/django"]

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"
  ace:
    provider: "hosted_vllm"
    api_key_env: "HOSTED_VLLM_API_KEY"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    api_base: "http://localhost:8800/v1"

output:
  dir: "_data"
  log_level: "DEBUG"
