# Smoke test: Embedding (cosine via sentence-transformers) skill retrieval (per_instance)
# Exercises: predict -> evaluate -> (force) learn loop with retrieval.type=embedding
# Retrieval fires on iter_1 once the skillbook has > skip_threshold skills.
# Loads Qwen/Qwen3-Embedding-4B on CUDA (cached under ~/.cache/huggingface/hub).
# Verify: statistics.json["retrieval"].type == "EmbeddingRetriever" and retrieve() ran.
experiment:
  name: "test: retrieval embedding"
  max_attempts: 2
  force_learn: true
  concurrency: 1
  skillbook:
    mode: "per_instance"
    custom_swe_learn: false
    deduplication:
      enabled: false
    retrieval:
      enabled: true
      type: "embedding"           # Cosine similarity via sentence-transformers
      model: "Qwen/Qwen3-Embedding-4B"
      device: "cuda"
      top_k: 1                    # Retrieve 1 skill (forces a real filter)
      skip_threshold: 0           # Fire as soon as ≥1 skill exists on iter_1

benchmark:
  dataset: "princeton-nlp/SWE-bench_Verified"
  split: "test"

agent:
  step_limit: 1
  cost_limit: 0.0

llm:
  agent: qwen3-coder-30b-local-8800

  ace: qwen3-coder-30b-local-8800

output:
  dir: "_data"
  log_level: "DEBUG"
