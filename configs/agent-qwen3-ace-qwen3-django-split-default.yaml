experiment:
  name: "agent-qwen3-ace-qwen3-django-split-default"
  description: "ACE skillbook learning experiment on SWE-bench Lite"
  max_attempts: 1                    # Max retry attempts per instance
  concurrency: 1

  skillbook:
    mode: "per_repo"              # "per_instance", "per_repo", or "global"
    custom_swe_learn: false            # SWE-optimized Reflector+SkillManager (anti-patterns, type prefixes)
    deduplication:
      enabled: true
      similarity_threshold: 0.85      # Cosine similarity threshold

  # --- Two-phase experiment settings (per_repo/global modes) ---
  split:                             # Enable train/val split
    val_ratio: 0.2                  # Fraction of instances for validation
  baseline_run_dir: "data/run_20260426_210831_baseline"  # Reuse baseline results (skip re-running val baseline + train predict/eval)

agent:
  step_limit: 200                    # Max agent steps per attempt

llm:
  agent:
    provider: "hosted_vllm"
    # model: "Qwen/Qwen3-Coder-Next-FP8"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    # api_base: "http://10.100.30.241:8800/v1"
    api_base: "http://localhost:8800/v1"
    api_key_env: "HOSTED_VLLM_API_KEY"
  ace:
    provider: "hosted_vllm"
    # model: "Qwen/Qwen3-Coder-Next-FP8"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    # api_base: "http://10.100.30.241:8800/v1"
    api_base: "http://localhost:8800/v1"
    api_key_env: "HOSTED_VLLM_API_KEY"

benchmark:
  dataset: "princeton-nlp/SWE-bench_Lite"
  split: "test"
  max_instances: null                 # null = all instances, or set number
  filter_repos: ["django/django"]                 # null = all repos, or list: ["django/django"]

evaluation:
  use_docker: true                    # Use Docker for evaluation (default)
  timeout: 1800                       # Seconds per patch evaluation (30 min)
  parallel: 1                         # Number of parallel evaluations

output:
  dir: "data"
  save_trajectories: true
  save_skillbooks: true
  save_logs: true
  log_level: "INFO"                   # DEBUG, INFO, WARNING, ERROR

observability:
  enabled: false
